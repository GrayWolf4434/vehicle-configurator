<mat-toolbar>
  <span>CustomerPricing – Eingabe</span>
</mat-toolbar>

<mat-card>
  <div class="topbar">
    <mat-progress-bar [value]="progress"></mat-progress-bar>
    <button mat-stroked-button color="warn" (click)="resetAll()">Zurücksetzen</button>
  </div>

  <mat-horizontal-stepper [linear]="true">
    <!-- Schritt 1 -->
    <mat-step [stepControl]="formStep1" label="Basisangaben">
      <form [formGroup]="formStep1">
        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>Marke *</mat-label>
            <mat-select formControlName="make" (selectionChange)="onMakeChange($event.value)">
              <mat-option *ngFor="let m of makes" [value]="m.id">{{ m.label }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Modell *</mat-label>
            <mat-select formControlName="model" (selectionChange)="onModelChange($event.value)">
              <mat-option *ngFor="let mo of models" [value]="mo.id">{{ mo.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>Jahr *</mat-label>
            <input matInput type="number" formControlName="year">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Monat</mat-label>
            <input matInput type="number" formControlName="month">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Tag</mat-label>
            <input matInput type="number" formControlName="day">
          </mat-form-field>
        </div>
      </form>
      <div>
        <button mat-raised-button color="primary" matStepperNext>Weiter</button>
      </div>
    </mat-step>

    <!-- Schritt 2 -->
    <mat-step [stepControl]="formStep2" label="Pflichtangaben">
      <form [formGroup]="formStep2">
        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>PLZ *</mat-label>
            <input matInput formControlName="zipCode">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Aufbau *</mat-label>
            <input matInput formControlName="category">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Kraftstoff *</mat-label>
            <input matInput formControlName="fuelType">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Kilometer *</mat-label>
            <input matInput type="number" formControlName="mileage">
          </mat-form-field>
        </div>
      </form>
      <div>
        <button mat-stroked-button matStepperPrevious>Zurück</button>
        <button mat-raised-button color="primary" matStepperNext>Weiter</button>
      </div>
    </mat-step>

    <!-- Schritt 3 -->
    <mat-step [stepControl]="formStep3" label="Optionen">
      <form [formGroup]="formStep3">
        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>Innenfarbe</mat-label>
            <mat-select formControlName="interiorColor">
              <mat-option *ngFor="let x of interiorColors" [value]="x.key">{{ x.label }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Leistung (kW)</mat-label>
            <input matInput type="number" formControlName="power">
          </mat-form-field>
        </div>
      </form>
      <div>
        <button mat-stroked-button matStepperPrevious>Zurück</button>
        <button mat-raised-button color="primary" matStepperNext>Weiter</button>
      </div>
    </mat-step>

    <!-- Schritt 4 -->
    <mat-step [stepControl]="formStep4" label="Zustände">
      <form [formGroup]="formStep4">
        <div class="row">
          <mat-checkbox formControlName="isRoadWorthy">Fahrtauglich</mat-checkbox>
          <mat-checkbox formControlName="isAccidentDamaged">Unfallfahrzeug</mat-checkbox>
          <mat-checkbox formControlName="isDamagedUnrepaired">Schaden unrepariert</mat-checkbox>
        </div>
      </form>
      <div>
        <button mat-stroked-button matStepperPrevious>Zurück</button>
        <button mat-raised-button color="accent" (click)="sendPricing()">Pricing senden</button>
      </div>
    </mat-step>
  </mat-horizontal-stepper>
</mat-card>
